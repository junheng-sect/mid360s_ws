# RC 触发录包节点默认配置（由 start_rc_record.sh 用 rosparam load 到 master）
# 顶层键必须与节点名一致：rospy 的 ~ 私有参数会落在 /rc_bag_recorder/* 下
rc_bag_recorder:
  # ---- 触发源 ----
  rc_topic: /mavros/rc/in
  rc_channel: 6              # 1-based：6 = 遥控器通道 6（飞控 RC_MAP_AUX1 也是 6）
  rc_threshold: 1650         # us；PX4 判据 aux1>0.3 约合 PWM>1650
  active_high: true          # true: PWM>=阈值 为触发位（与 SDLOG_MODE=3 的 ulog 同向）
  confirm_samples: 3         # 连续 N 拍一致才认账（去抖）
  release_tail_s: 1.0        # 松手后再录多久（期间重新拨下则继续同一个包）
  rc_warn_timeout_s: 5.0     # 多久收不到 RC 就告警
  stop_on_rc_loss: false     # false: RC 丢失不截断正在录的包

  # ---- 输出 ----
  bag_directory: /home/orangepi/test_data/bags
  bag_prefix: handheld       # 包名 handheld_000001.bag，序号文件 .handheld_sequence
  record_raw_cloud: false    # true 则额外录 /livox/lidar（约 +5 MB/s）
  record_registered_cloud: false  # true 则额外录 /cloud_registered（约 +3 MB/s）
  status_rate: 2.0           # /rc_record/status 发布频率

  # ---- 录制话题（必须都在 bag_recorder_node.py 的类型登记表里）----
  topics:
    - /mavros/state
    - /mavros/extended_state                 # 原始着地状态，核对 TOUCHED 与真实接触
    - /mavros/estimator_status               # const_pos 及定位/速度有效标志
    - /mavros/timesync_status
    - /mavros/local_position/pose
    - /mavros/local_position/odom
    - /mavros/local_position/velocity_local
    - /mavros/vision_pose/pose_cov
    - /mavros/odometry/out                    # ev_mode=odom 时实际送飞控的位姿 + 速度
    - /fastlio/vision_odom                    # 同上的本地回显（不送飞控时只有它）
    - /fastlio/odom_world
    - /tether_winch_control/status
    - /Odometry
    - /livox/imu
    # front_marker_control（控制节点没跑时没有消息，不影响录包）：
    - /front_marker_control/control_mode      # 状态机阶段 ALIGN/YAW_SAMPLING/POSE_ALIGNING/POS_HOLD/RETREAT
    - /front_marker_control/status            # 状态文本（门控原因、目标、采样统计）
    - /front_marker_control/position_error    # 视觉位置误差（机体系）
    - /mavros/setpoint_raw/local              # 实际发给飞控的 setpoint（20 Hz）
    - /fastlio/velocity
    - /drone_nav/odom
    - /drone_nav/sensor_odom
    - /drone_nav/cloud
    - /drone_nav/planner_goal
    - /drone_nav/bspline
    - /drone_nav/command
    - /drone_nav/setpoint_preview
    - /drone_nav/input_status
    - /drone_nav/planner_status
    - /drone_nav/executor_status
    - /drone_nav/gateway_status
    - /drone_reloc/status
    - /drone_reloc/result
    - /tf
    - /tf_static
  # 只在变化时发布的 latch 话题：平时缓存最新一条，开包时先补写当前值（须同时在 topics 里）
  latched_topics:
    - /tf_static
    - /drone_reloc/result
    - /front_marker_control/control_mode
