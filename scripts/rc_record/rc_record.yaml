# RC 触发录包节点默认配置（由 start_rc_record.sh 用 rosparam load 到 master）
# 顶层键必须与节点名一致：rospy 的 ~ 私有参数会落在 /rc_bag_recorder/* 下
rc_bag_recorder:
  # ---- 触发源 ----
  rc_topic: /mavros/rc/in
  rc_channel: 6              # 1-based：6 = 遥控器通道 6（飞控 RC_MAP_AUX1 也是 6）
  rc_threshold: 1650         # us；PX4 判据 aux1>0.3 约合 PWM>1650
  active_high: true          # true: PWM>=阈值 为触发位（与 SDLOG_MODE=3 的 ulog 同向）
  confirm_samples: 3         # 连续 N 拍一致才认账（去抖）
  release_tail_s: 1.0        # 松手后再录多久（期间重新拨下则继续同一个包）
  rc_warn_timeout_s: 5.0     # 多久收不到 RC 就告警
  stop_on_rc_loss: false     # false: RC 丢失不截断正在录的包

  # ---- 输出 ----
  bag_directory: /home/orangepi/test_data/bags
  bag_prefix: handheld       # 包名 handheld_000001.bag，序号文件 .handheld_sequence
  record_raw_cloud: false    # true 则额外录 /livox/lidar（约 +5 MB/s）
  status_rate: 2.0           # /rc_record/status 发布频率

  # ---- 录制话题（必须都在 bag_recorder_node.py 的类型登记表里）----
  topics:
    - /mavros/state
    - /mavros/timesync_status
    - /mavros/local_position/pose
    - /mavros/local_position/odom
    - /mavros/local_position/velocity_local
    - /mavros/vision_pose/pose_cov
    - /fastlio/odom_world
    - /tether_winch_control/status
    - /Odometry
    - /livox/imu
