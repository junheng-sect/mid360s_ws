# test11: same body envelope and motion limits as test10.
config:
  deployment_verified: true
  map_id: /home/orangepi/test_data/mapping/20261105_114605_outdoor
  # 雷达 IMU -> PX4 控制参考点（重心），机体 FLU。由飞控 EKF2_EV_POS_X/Y/Z = (0.016, -0.021, -0.053)（FRD，
  # 雷达相对重心）取反换轴得到，11.3 log89 的参数；换过雷达安装要重新核对
  lever_body: [-0.016, -0.021, -0.053]
  sensor_offset_imu: [-0.011, -0.02329, 0.04412] # 激光发射点在 IMU 系，沿用模板
  # 以控制参考点为中心的机体半包络。EGO 膨胀是世界系方盒、不随 yaw 转，水平取外接圆半径 540/2 = 0.27；
  # 竖直 0.15：机高 26 cm，重心不在正中，取重心到顶 / 到底中较大的一个（雷达 IMU 在重心上方 5.3 cm，估计到底约 15 cm，
  # 11-07 用户定）。网关要求 half_height ≥ 0.15 + clearance，launch 默认 half_height 已改 0.30（和 0.25 一样都是 3 格）；
  # grid_map 要求机体框必须已观测，竖直从 ±1 格变成 ±2 格（±0.2 m）
  body_half_extent: [0.27, 0.27, 0.15]
  # 膨胀半径按用户定的 1.5 倍：0.27 x 1.5 = 0.405。EGO 按 ceil(半径/0.1 m) 取格，0.405 会进成 5 格（±0.5 m），
  # 所以用 launch 默认 radius 0.40（4 格，1.48 倍）；网关要求 radius ≥ 0.27 + clearance，故 clearance 0.13
  clearance: 0.13
  # 11-07 用户定：头顶未知当空闲。MID-360 竖直视场只到 +52°、天空无回波，室外飞机头顶 0.3 m 以上一直是未知格，
  # test5 升高 0.5 m 被整段检查拒绝。打开后，同一竖列往下先碰到已观测空闲的未知格当空闲（EGO 规划、收目标、
  # 路径检查都用这一条）；往下先碰到障碍、或一直到底都没观测到的（遮挡阴影）仍然挡。不限于雷达以上：雷达往下
  # 也只看到 -7°，爬升时刚离开的格子会落进下方盲区。正上方的树枝、电线本来就看不见。室内不要开
  allow_unknown_above: true
  # test11 独立飞行边界，使用 drone_odom。
  goal_boundary_margin: 0.30 # 航点距任一边界至少 30 cm；整轮发出前预检
  bounds_min: [-2.0, -6.0, 0.4]
  bounds_max: [9.2, 7.0, 3.6]
  # 11-07 室外从 0.5 / 0.5 放宽（用户定）。common.sh 把这两项传给 EGO（以前没传，EGO 一直按 launch 默认 0.5）。
  # EGO 是单轴限幅（launch 里除以 √3，直线最快约 0.58 m/s）；11-07 晚起重规划按单轴上限分配时间（原来 2/3，
  # 长航段中途掉到 0.31 m/s）。网关/执行器按三维模长拦超过这两个值的指令
  max_vel: 1.0
  max_acc: 1.0
  # 11-07 晚用户定：竖直单独限速，原来和水平同为 0.577 m/s，升降 0.5 m 峰值 0.48 m/s、加速度 0.76 m/s² 太冲。
  # 原值直接作为竖直上限（不除以 √3），不超过水平单轴上限；common.sh 传给 EGO
  max_vel_z: 0.3
  max_acc_z: 0.3
  # 11-07 晚用户定：到点后原地转向速率（°/s），默认 10 太慢（转 90° 要 9 s）。此时 LIO/PX4 航向残差在 10°/s
  # 下最大 0.38°（网关 3° 故障），30°/s 估计约 1°。
  # 11-11 test8 用户要求 45°/s（转 90° 约 2 s）；只有 test8 用本文件，test7 仍用 outdoor_nav.yaml 的 30。
  yaw_rate_deg: 45
  # 11-07 晚 test6：地面自动起飞的爬升高度（m，相对起飞时飞控本地位置），按上面的 max_vel_z / max_acc_z 爬；网关读，
  # 范围 0.3~2.5。起飞走网关 OFFBOARD（PX4 AUTO.TAKEOFF 在外部航向下没有全局位置，用不了）
  takeoff_height: 1.0
