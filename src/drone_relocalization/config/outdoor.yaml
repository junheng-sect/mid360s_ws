# 室外大图（11-05 加）：每次都在建图原点附近的起飞圆柱里（水平 3 m、上下 0.5 m）启动重定位。
# 只用原点 20 m 内、地面 −0.5～+4 m 的地图（地面点 0.2 m、其余 0.1 m 体素），实时点云截到水平 16 m；
# 全局搜索只在起飞圆柱内找候选，解落在圆柱外就拒绝。质量门限与室内相同，没有为室外放宽。
