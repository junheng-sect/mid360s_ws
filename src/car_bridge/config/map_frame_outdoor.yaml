# 室外统一 map 系标定（11-05 用户定）：map 就是建图时无人机机头为 x 的 FLU 系，只把 z=0 放到地面。
# 原点：建图起点（飞机放在起飞点地上时的雷达 IMU）正下方的地面；x：建图开始时机头的水平朝向，y 朝左，z 朝上。
# 无人机图 20261105_114605_outdoor：起点 1 m 内地面拟合在 z=-0.1509（2179 点，残差 1.4 cm），所以 z 加 0.151；
#   x、y、yaw 不动。用室内图的约定（z=0 在地面），car_base_height 才对得上。
# 车：室外还没有车图、没配准，car_map_id / map_from_car_map 留 null，car_bridge 不发 map->car_map 和车位姿。
#   车建好室外图后照室内的做法离线配准，填 car_map<-drone_map 换算出的 map_from_car_map。
drone_map: 20261105_114605_outdoor
car_map_id: null
# p_map = Rz(yaw) @ p + (x, y, z)
map_from_drone_map: {x: 0.0, y: 0.0, z: 0.151, yaw_deg: 0.0}
map_from_car_map: null
car_base_height: 0.20
